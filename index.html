<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breeze</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link href="./style.css" rel="stylesheet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="./manifest.json">
</head>
<body>

<div class="win-titlebar" id="winTitlebar" style="display:none;">
  <div class="win-drag-area">Breeze</div>
  <div class="win-controls">
    <button class="win-btn" onclick="window.electronAPI.sendControl('min')" aria-label="Minimize">
      <svg width="10" height="1" viewBox="0 0 10 1"><rect width="10" height="1" fill="currentColor"/></svg>
    </button>
    <button class="win-btn" onclick="window.electronAPI.sendControl('max')" aria-label="Maximize">
      <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
    </button>
    <button class="win-btn win-close" onclick="window.electronAPI.sendControl('close')" aria-label="Close">
      <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
  </div>
</div>

<div class="app-body">

<div class="sidebar open" id="sidebar">
  <div class="sidebar-inner">
    <div class="mac-traffic-spacer" id="macSpacer" style="display:none;"></div>

    <div class="sidebar-header">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div class="sidebar-title" id="lblLokasi" style="margin-bottom: 0;">Lokasi</div>
        <button class="settings-btn" id="settingsBtn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
      
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Cari kota...">
      </div>
    </div>
    
    <div class="sidebar-list" id="locationList"></div>
  </div>
</div>

<div class="main" id="mainEl">
  
  <div class="loading-overlay" id="loadingOverlay"></div>
  <div class="bg-overlay" id="mainBgOverlay"></div>
  <canvas id="rainCanvas"></canvas>

  <div class="top-bar">
    <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="location-label">
      <svg id="topLocationIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span id="currentCity">—</span>
    </div>
  </div>

  <div class="hero">
    <div class="hero-content">
      <div class="hero-left">
        <div class="temp-display" id="tempDisplay">—</div>
        <div class="condition" id="conditionText">—</div>
        <div class="hi-lo" id="hiLoText">↑ —° / ↓ —°</div>
      </div>

      <div class="cards-wrapper">
        <div class="cards-grid">
          
          <div class="card card-forecast">
            <div class="card-label">
              <svg viewBox="0 0 24 24"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
              <text class="card-title" id="lblPrakiraan">Prakiraan</text>
            </div>
            <div class="forecast-wrapper">
              <div class="forecast-scroll-area">
                <div class="forecast-container">
                  <div class="forecast-row" id="forecastRow"></div>
                  <svg class="forecast-chart" id="forecastChart" preserveAspectRatio="none"></svg>
                </div>
              </div>
            </div>
            <ul class="forecast-bullets" id="forecastBullets"></ul>
          </div>

          <div class="card card-daily">
            <div class="card-label">
              <svg class="stroke-only" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <text class="card-title" id="lblLimaHari">5 Hari Kedepan</text>
            </div>
            <div class="daily-wrapper" id="dailyForecast"></div>
          </div>
          
          <div class="card card-uv">
            <div class="card-label">
              <svg class="stroke-only" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
              </svg>
              <text class="card-title" id="lblUV">Indeks UV</text>
            </div>
            <div class="uv-wrapper">
              <div class="uv-value" id="uvValue">—</div>
              <div class="uv-bar-container">
                <div class="uv-bar"></div>
                <div class="uv-dot" id="uvDot"></div>
              </div>
            </div>
          </div>

          <div class="card card-rain">
            <div class="card-label card-peluang">
              <svg class="stroke-only" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 13v8M8 13v8M12 15v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>
              </svg>
              <text class="card-title" id="lblHujan">Peluang Hujan</text>
            </div>
            <div class="rain-wrapper">
              <div class="rain-value" id="rainValue">—%</div>
              <div class="rain-sub" id="rainSub">—</div>
            </div>
          </div>

          <div class="card card-ai">
            <div class="card-label">
              <svg viewBox="0 0 24 24"><path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm-1.177-7.86l-2.765-2.767L7 12.431l3.118 3.121a1 1 0 0 0 1.414 0l5.952-5.95-1.062-1.062-5.6 5.6z"/></svg>
              <text class="card-title" id="lblAI">Rekomendasi dari AI</text>
            </div>
            <ul class="ai-bullets" id="aiBullets"></ul>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

</div>

<div class="settings-overlay" id="settingsModal">
  <div class="settings-card card" id="settingsCard">
    <div class="settings-content-wrap" id="settingsContentWrap">
      <div class="settings-header">
        <h2 class="card-title" id="lblSettingsTitle">Pengaturan</h2>
        <button class="settings-close" id="settingsClose" aria-label="Close settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
      <div class="settings-body">
        
        <div class="setting-item">
          <label id="lblLang">Bahasa / Language</label>
          <div class="custom-select" id="langCustomSelect">
            <div class="select-trigger">
              <span class="select-label">Indonesia</span>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="select-options">
              <div class="select-option" data-value="id">Indonesia</div>
              <div class="select-option" data-value="en">English</div>
            </div>
          </div>
        </div>

        <div class="setting-item">
          <label id="lblUnit">Satuan Suhu / Temp Unit</label>
          <div class="custom-select" id="unitCustomSelect">
            <div class="select-trigger">
              <span class="select-label">Celsius (°C)</span>
              <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </div>
            <div class="select-options">
              <div class="select-option" data-value="c">Celsius (°C)</div>
              <div class="select-option" data-value="f">Fahrenheit (°F)</div>
            </div>
          </div>
        </div>

        <div class="setting-item" style="margin-top: 8px;">
          <button class="settings-btn-action" id="btnCheckLoc">
            <span id="btnCheckLocText">Periksa izin lokasi</span>
          </button>
        </div>

      </div>
    </div>
  </div>
</div>
<script src="./weder.js"></script>
<script>
  if (window.electronAPI && window.electronAPI.onPlatform) {
    window.electronAPI.onPlatform(function(platform) {
      document.body.classList.add('platform-' + platform)
      if (platform === 'darwin') {
        document.getElementById('macSpacer').style.display = 'block'
        const sb = document.getElementById('settingsBtn')
        if (sb) sb.style.display = 'none'
      } else if (platform === 'win32' || platform === 'linux') {
        document.getElementById('winTitlebar').style.display = 'flex'
      }
    })
  }
  if (window.electronAPI && window.electronAPI.onFullscreen) {
    window.electronAPI.onFullscreen(function(isFs) {
      document.getElementById('macSpacer').classList.toggle('fullscreen', isFs)
    })
  }
  if (window.electronAPI && window.electronAPI.onSettings) {
  window.electronAPI.onSettings(function() {
    document.getElementById('settingsBtn').click()
  })
}
</script>
</body>
</html>
